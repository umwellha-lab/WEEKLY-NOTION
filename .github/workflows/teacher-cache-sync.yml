name: teacher-cache-sync

on:
  push:
    branches: [main]
    paths:
      - "sync_teacher_cache.py"
      - ".github/workflows/teacher-cache-sync.yml"
  schedule:
    # KST weekdays 14:00-23:50 = UTC weekdays 05:00-14:50
    - cron: "*/10 5-14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "캐시 동기화 날짜 (YYYY-MM-DD). 비우면 KST 오늘"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: teacher-cache-sync
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Sync Notion teacher cache to Supabase
        run: python3 sync_teacher_cache.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
